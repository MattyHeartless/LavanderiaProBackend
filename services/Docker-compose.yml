services:
  # 1. Tu base de datos actual (si quieres que Compose la gestione)
  # database:
  #   image: mcr.microsoft.com/mssql/server:2022-latest
  #   container_name: elastic_yonath
  #   environment:
  #     - ACCEPT_EULA=Y
  #     - MSSQL_SA_PASSWORD=Test123!
  #   ports:
  #     - "1433:1433"

  # 2. Microservicio de Auth
  auth-api:
    build:
      context: ./Auth
      dockerfile: Dockerfile
    container_name: auth_service
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=192.168.1.90;Database=LavanderiaPro;User Id=sa;Password=Test123!;TrustServerCertificate=True
 

  # 3. Microservicio de Catalogs
  catalogs-api:
    build:
      context: ./Catalogs
      dockerfile: Dockerfile
    container_name: catalogs_service
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=192.168.1.90;Database=LavanderiaProCatalogs;User Id=sa;Password=Test123!;TrustServerCertificate=True
   

  # 4. Microservicio de Orders
  orders-api:
    build:
      context: ./Orders
      dockerfile: Dockerfile
    container_name: orders_service
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=192.168.1.90;Database=LavanderiaProOrders;User Id=sa;Password=Test123!;TrustServerCertificate=True
   

  # 5. Microservicio de Profile
  profile-api:
    build:
      context: ./Profile
      dockerfile: Dockerfile
    container_name: profile_service
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=192.168.1.90;Database=LavanderiaProProfile;User Id=sa;Password=Test123!;TrustServerCertificate=True
   