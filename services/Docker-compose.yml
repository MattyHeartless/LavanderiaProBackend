services:
  # 1. Tu base de datos actual (si quieres que Compose la gestione)
  # database:
  #   image: mcr.microsoft.com/mssql/server:2022-latest
  #   container_name: elastic_yonath
  #   environment:
  #     - ACCEPT_EULA=Y
  #     - MSSQL_SA_PASSWORD=Test123!
  #   ports:
  #     - "1433:1433"

  # 2. Microservicio de Auth
  auth-api:
    build:
      context: ./Auth
      dockerfile: Dockerfile
    container_name: auth_service
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__AuthConnection=Server=192.168.100.53;Database=LavanderiaPro;User Id=sa;Password=Test123!;TrustServerCertificate=True
 

  # 3. Microservicio de Catalogs
  catalogs-api:
    build:
      context: ./Catalogs
      dockerfile: Dockerfile
    container_name: catalogs_service
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__CatalogsDb=Server=192.168.100.53;Database=LavanderiaProCatalogs;User Id=sa;Password=Test123!;TrustServerCertificate=True

  # 4. Microservicio de Orders
  orders-api:
    build:
      context: ./Orders
      dockerfile: Dockerfile
    container_name: orders_service
    ports:
      - "5252:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__OrdersDb=Server=192.168.100.53;Database=LavanderiaProOrders;User Id=sa;Password=Test123!;TrustServerCertificate=True
      - Notifications__BaseUrl=http://notifications-api:8080/api/Notifications/
      - Notifications__InternalApiKey=development-only-notifications-internal-key

  notifications-api:
    build:
      context: ./Notifications
      dockerfile: Dockerfile
    container_name: notifications_service
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__NotificationsDb=Server=192.168.100.53;Database=LavanderiaProNotifications;User Id=sa;Password=Test123!;TrustServerCertificate=True
   

  # 5. Microservicio de Profile
  profile-api:
    build:
      context: ./Profile
      dockerfile: Dockerfile
    container_name: profile_service
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__ProfileConnection=Server=192.168.100.53;Database=LavanderiaProProfile;User Id=sa;Password=Test123!;TrustServerCertificate=True
   
